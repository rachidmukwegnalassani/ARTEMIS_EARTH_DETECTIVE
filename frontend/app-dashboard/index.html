<div class="chat-input-area">

  <input
    id="chat-input"
    type="text"
    placeholder="Posez une question ou demandez une analyse..."
  />

  <button
    id="chat-upload-btn"
    type="button"
  >
    📎
  </button>

  <button
    id="chat-send-btn"
    type="button"
  >
    Envoyer
  </button>

  <input
    id="chat-file-input"
    type="file"
    hidden
    accept=".csv,.xlsx,.txt,.pdf,.json,.geojson,.nc,.hdf,.tif,.tiff"
  />

</div>
